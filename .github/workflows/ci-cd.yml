name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Workload Identity Federation (sin claves JSON)

env:
  NODE_VERSION: '22'
  REGION: us-east5
  SERVICE_NAME: vondi-api
  MIGRATE_JOB: vondi-migrate
  REPOSITORY: vondi-api
  IMAGE_NAME: vondi-api

jobs:
  # =============================================================================
  # CI: tests y calidad
  # =============================================================================
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate migrations
        run: npm run migrations:validate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Security scan
        run: npm run secrets:staged

  # =============================================================================
  # Build: imagen en Artifact Registry (solo en push a main)
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          platforms: linux/amd64

  # =============================================================================
  # Migrate: Cloud Run Job, una ejecución, falla visible (sin reintentos)
  # =============================================================================
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update migrate job and execute
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}-migrate:${{ github.sha }}
          gcloud run jobs deploy ${{ env.MIGRATE_JOB }} \
            --image="$IMAGE" \
            --region=${{ env.REGION }} \
            --service-account=vondi-migrator@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=600s \
            --set-secrets=CONTROL_PLANE_DATABASE_URL_UNPOOLED=control-plane-db-url-unpooled:latest
          gcloud run jobs execute ${{ env.MIGRATE_JOB }} --region=${{ env.REGION }} --wait

  # =============================================================================
  # Deploy: Cloud Run (producción)
  # =============================================================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: migrate
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=vondi-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --max-instances=100 \
            --min-instances=0 \
            --timeout=300s \
            --concurrency=15 \
            --set-env-vars=NODE_ENV=production,TRUST_PROXY_HOPS=1,DOCS_ENABLED=false,DATABASE_POOL_MAX=10,DATABASE_CONNECTION_TIMEOUT_MS=15000 \
            --set-secrets=CONTROL_PLANE_DATABASE_URL=control-plane-db-url:latest,TENANT_PLANE_DATABASE_URL=tenant-plane-db-url:latest,JWT_ACCESS_SECRET=jwt-access-secret:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,PII_HMAC_KEY=pii-hmac-key:latest,PII_ENCRYPTION_KEY=pii-encryption-key:latest,NETPAY_ENCRYPTION_KEY=netpay-encryption-key:latest

      - name: Get service URL
        id: service_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        run: |
          sleep 10
          curl -fsS "${{ steps.service_url.outputs.url }}/health"
