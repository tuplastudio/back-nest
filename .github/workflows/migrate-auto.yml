name: Auto Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22'

jobs:
  # =============================================================================
  # Detect migration changes
  # =============================================================================
  detect-changes:
    name: Detect Migration Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for migration changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "prisma/migrations"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Migration changes detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No migration changes detected"
          fi

  # =============================================================================
  # Validate migrations before applying
  # =============================================================================
  validate:
    name: Validate Migrations
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate migrations
        run: npm run migrations:validate

  # =============================================================================
  # Apply migrations to staging
  # =============================================================================
  migrate-staging:
    name: Migrate Staging
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: needs.detect-changes.outputs.has_changes == 'true'

    environment:
      name: staging
      url: https://vondi-api-staging-xxxxx.a.run.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Set environment variables
        run: |
          echo "CONTROL_PLANE_DATABASE_URL=${{ secrets.STAGING_CONTROL_PLANE_DATABASE_URL }}" >> $GITHUB_ENV
          echo "CONTROL_PLANE_DATABASE_URL_UNPOOLED=${{ secrets.STAGING_CONTROL_PLANE_DATABASE_URL_UNPOOLED }}" >> $GITHUB_ENV

      - name: Check database connection
        run: |
          npm install -g pg
          node -e "
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.CONTROL_PLANE_DATABASE_URL_UNPOOLED });
          client.connect();
          client.query('SELECT 1').then(() => {
            console.log('Database connection successful');
            client.end();
          }).catch(err => {
            console.error('Database connection failed:', err);
            process.exit(1);
          });
          "

      - name: Show pending migrations
        run: |
          echo "Pending migrations for staging:"
          npx prisma migrate status --schema prisma/schema.prisma

      - name: Apply migrations to staging
        run: |
          echo "Applying migrations to staging..."
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration
        run: |
          echo "Verifying migration status..."
          npx prisma migrate status --schema prisma/schema.prisma

      - name: Notify on success
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Database migrations applied successfully to staging'
            });

  # =============================================================================
  # Apply migrations to production (manual approval required)
  # =============================================================================
  migrate-production:
    name: Migrate Production
    runs-on: ubuntu-latest
    needs: [detect-changes, validate, migrate-staging]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main')

    environment:
      name: production
      url: https://vondi-api-xxxxx.a.run.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Set environment variables
        run: |
          echo "CONTROL_PLANE_DATABASE_URL=${{ secrets.PRODUCTION_CONTROL_PLANE_DATABASE_URL }}" >> $GITHUB_ENV
          echo "CONTROL_PLANE_DATABASE_URL_UNPOOLED=${{ secrets.PRODUCTION_CONTROL_PLANE_DATABASE_URL_UNPOOLED }}" >> $GITHUB_ENV

      - name: Check database connection
        run: |
          npm install -g pg
          node -e "
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.CONTROL_PLANE_DATABASE_URL_UNPOOLED });
          client.connect();
          client.query('SELECT 1').then(() => {
            console.log('Database connection successful');
            client.end();
          }).catch(err => {
            console.error('Database connection failed:', err);
            process.exit(1);
          });
          "

      - name: Show pending migrations
        run: |
          echo "Pending migrations for production:"
          npx prisma migrate status --schema prisma/schema.prisma

      - name: Apply migrations to production
        run: |
          echo "Applying migrations to production..."
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration
        run: |
          echo "Verifying migration status..."
          npx prisma migrate status --schema prisma/schema.prisma

      - name: Create deployment summary
        if: always()
        run: |
          echo "### Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Completed at $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on success
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Database migrations applied successfully to production'
            });

      - name: Notify on failure
        uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Database migration failed in production. Please check the logs.'
            });
