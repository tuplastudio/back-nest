# UN SOLO USO. No debe quedar en el repositorio.
#
# Copia los cuatro secrets STAGING_* del environment de GitHub al Secret Manager
# de vondi-0q-staging y concede el acceso por secreto. La contraseña de la base
# no sale de GitHub: el pipeline la escribe directamente en el secreto, así que
# nunca pasa por un terminal ni por el log de nadie.
#
# Es la forma de provisionar un entorno sin que alguien copie las cuatro
# cadenas a mano. Su Dangerous, y por eso es de un solo uso: quien pueda
# despacharlo puede sobrescribir las cuatro URLs de un entorno. Para eso está
# provision-secrets.sh, que es local, deja rastro en el terminal de quien lo
# ejecuta y no se puede lanzar desde un push.
#
# Los secretos de cifrado y firma NO se crean aquí: se generan en el terminal
# con provision-secrets.sh y se imprimen una vez para su custodia.

name: provision-staging-db-urls

on:
  # `push` y no `workflow_dispatch`: un workflow que solo existe en una rama
  # distinta de la principal no se puede despachar por nombre, porque GitHub lo
  # busca en la rama por defecto. Con `push` se ejecuta desde el ref que trae el
  # fichero, que es justo lo que se quiere para algo de un solo uso.
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  copiar:
    name: Copiar las cuatro cadenas a Secret Manager
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      # El mismo criterio que aplica scripts/provision-secrets.sh: una URL de
      # migraciones que apunte al pooler es un error de configuración, no algo
      # que se descubra cuando el Job falla por conexión.
      - name: Comprobar y escribir los cuatro secretos
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          CONTROL: ${{ secrets.STAGING_CONTROL_PLANE_DATABASE_URL }}
          CONTROL_UNPOOLED: ${{ secrets.STAGING_CONTROL_PLANE_DATABASE_URL_UNPOOLED }}
          TENANT: ${{ secrets.STAGING_TENANT_PLANE_DATABASE_URL }}
          TENANT_UNPOOLED: ${{ secrets.STAGING_TENANT_PLANE_DATABASE_URL_UNPOOLED }}
        run: |
          set -euo pipefail

          for V in CONTROL CONTROL_UNPOOLED TENANT TENANT_UNPOOLED; do
            [ -n "${!V:-}" ] || { echo "Falta \$$V en el environment." >&2; exit 1; }
          done
          case "$CONTROL_UNPOOLED$TENANT_UNPOOLED" in
            *-pooler.*)
              echo "Una URL *UNPOOLED apunta al pooler. Las migraciones y los" >&2
              echo "scripts de administración usan el host directo." >&2
              exit 1
              ;;
          esac

          put() { # put <secreto> <valor>
            if gcloud secrets describe "$1" --project "$PROJECT" >/dev/null 2>&1; then
              echo "  $1 ya existe; NO se sobrescribe"
              return 0
            fi
            printf '%s' "$2" | gcloud secrets create "$1" --project "$PROJECT" \
              --replication-policy=automatic --data-file=- >/dev/null
            echo "  $1 creado"
          }

          put control-plane-db-url          "$CONTROL"
          put tenant-plane-db-url           "$TENANT"
          put control-plane-db-url-unpooled "$CONTROL_UNPOOLED"
          put tenant-plane-db-url-unpooled  "$TENANT_UNPOOLED"

          # Solo el host, nunca la contraseña: sirve para confirmar a qué rama
          # de Neon apunta este entorno, que es justo lo que hay que verificar
          # a mano después de provisionar.
          echo "Host: $(printf '%s' "$CONTROL_UNPOOLED" | sed -E 's#.*@([^/]+)/.*#\1#')"

      # Acceso por secreto y por cuenta, nunca a nivel de proyecto.
      # vondi-runtime no recibe las URLs directas: la conexión sin pooler existe
      # para migraciones y administration.
      - name: Conceder acceso por secreto
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          RUNTIME="vondi-runtime@$PROJECT.iam.gserviceaccount.com"
          MIGRATOR="vondi-migrator@$PROJECT.iam.gserviceaccount.com"

          grant() { # grant <secreto> <cuenta>
            gcloud secrets add-iam-policy-binding "$1" --project "$PROJECT" \
              --member="serviceAccount:$2" \
              --role="roles/secretmanager.secretAccessor" --condition=None --quiet >/dev/null
            echo "  $1 -> ${2%%@*}"
          }

          for S in control-plane-db-url tenant-plane-db-url; do grant "$S" "$RUNTIME"; done
          for S in control-plane-db-url-unpooled tenant-plane-db-url-unpooled; do grant "$S" "$MIGRATOR"; done
