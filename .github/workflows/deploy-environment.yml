# Despliegue a UN entorno, reutilizable. Lo invoca deploy.yml con
# `environment: staging` o `environment: production`.
#
#   build ─► migrate ─► deploy ─► smoke ─► promote
#                            │        │
#                  falla: nada llega └ falla: rollback
#
# POR QUÉ REUTILIZABLE Y NO DOS FICHEROS
#
# Un fichero por entorno duplicaría el bloque de build, el de migraciones y el
# de humo, que son idénticos salvo por el nombre de sus variables. La
# duplicación no se paga solo en mantenimiento: la primera vez que un cambio
# tuvo que aplicarse a los dos sitios, el error (`gcloud run services deploy`,
# que no existe) estaba en los dos. Una sola definición es la que evita esa
# clase de fallo.
#
# POR QUÉ EL `environment:` VIENE POR INPUT
#
# Es lo que hace que las `vars.*` resuelvan. `GCP_PROJECT_ID` es `vondi-0q` en
# producción y `vondi-0q-staging` en staging, y sale del environment del job
# (§17). Además es lo que concede la identidad por WIF: la condición de la pool
# de producción exige `ref == refs/heads/main` y la de staging
# `environment == staging`, y el job que declara `environment: staging` es
# precisamente el que cumple la segunda.
#
# Por eso las variables van en el `env:` **de cada job** y no a nivel de
# workflow: a nivel de workflow, un job sin `environment:` las recibe vacías y
# sin error, que es como `IMAGE_BASE` llegó a valer `-docker.pkg.dev///vondi-api`
# en el job de verificación. A nivel de job, la variable y el environment que
# la resuelve están en la misma pantalla.
#
# LO QUE ES SOLO DE UN ENTENTIMENT
#
# Tres cosas, y cada una por su motivo:
#
#   * el canario, solo en producción: su URL no es alcanzable desde CI porque
#     producción tiene el ingress cerrado, así que hace falta una revisión
#     desplegada aparte contra la que humear antes de que nada llegue a tráfico;
#   * la promoción, solo en producción: en staging el despliegue ya va al 100%,
#     y `promote` es el mecanismo de "no sirvas tráfico hasta que el humo pase";
#   * el escaneo de la imagen, solo en producción: `trivy-action` necesita
#     permisos de Cloud Storage para su caché, que el deployer de staging no
#     tiene. Las dos imágenes salen del mismo commit, así que escanear en el
#     gate de producción cubre el mismo contenido. Si se quiere el escaneo
#     antes del merge, hay que darle a `vondi-deployer` de staging los
#     mismos permisos que al de producción.
#
# Diseño y motivos: docs/DEPLOY-GCP.md §12.

name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment de GitHub (staging | production)'
        required: true
        type: string
      skip_migrations:
        description: 'Omitir las migraciones (solo hotfix; deja el esquema atrás)'
        required: false
        type: boolean
        default: false

# El grupo incluye el entorno para que un despliegue a staging no cancele uno
# de producción ni al revés, y la ref para que dos ramas no se pisen.
#
# Solo se cancela un despliegue a staging lanzado desde un PR: es el caso en el
# que un commit nuevo deja obsoleto el anterior y no hay nada que perder. En
# cualquier otro caso no se cancela: cortar entre migrar y promover deja
# esquema y código descuadrados (§12.3).
concurrency:
  group: deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.environment == 'staging' && github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push_app.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Centinela
        id: push_app
        run: echo ok
