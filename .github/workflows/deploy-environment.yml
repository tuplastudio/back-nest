# Despliegue a UN entorno, reutilizable. Lo invoca deploy.yml con
# `environment: staging` o `environment: production`.
#
#   build ─► migrate ─► deploy ─► smoke ─► promote
#                         (sin tráfico,   (URL     (10 → 50 → 100 en producción,
#                          tag rc-<sha>)   del tag)  100 en staging; 5xx por
#                                                    escalón; rollback si falla)
#
# Lo mismo en los dos entornos (BN-REQ-OPS-006): la revisión nueva nunca recibe
# tráfico hasta que su URL etiquetada pasó el humo, y luego lo recibe por
# escalones vigilando su tasa de 5xx en Cloud Monitoring.
#
# POR QUÉ REUTILIZABLE Y NO DOS FICHEROS
#
# Un fichero por entorno duplicaría el bloque de build, el de migraciones y el
# de humo, que son idénticos salvo por el nombre de sus variables. La
# duplicación no se paga solo en mantenimiento: la primera vez que un cambio
# tuvo que aplicarse a los dos sitios, el error (`gcloud run services deploy`,
# que no existe) estaba en los dos. Una sola definición es la que evita esa
# clase de fallo.
#
# POR QUÉ EL `environment:` VIENE POR INPUT
#
# Es lo que hace que las `vars.*` resuelvan. `GCP_PROJECT_ID` es `vondi-0q` en
# producción y `vondi-0q-staging` en staging, y sale del environment del job
# (§17). Además es lo que concede la identidad por WIF: la condición de la pool
# de producción exige `ref == refs/heads/main` y la de staging
# `environment == staging`, y el job que declara `environment: staging` es
# precisamente el que cumple la segunda.
#
# Por eso las variables van en el `env:` **de cada job** y no a nivel de
# workflow: a nivel de workflow, un job sin `environment:` las recibe vacías y
# sin error, que es como `IMAGE_BASE` llegó a valer `-docker.pkg.dev///…`
# en el job de verificación. A nivel de job, la variable y el environment que
# la resuelve están en la misma pantalla.
#
# LO QUE CAMBIA ENTRE ENTORNOS
#
# Solo datos, no pasos: los flags de runtime salen de .github/cloudrun/flags.json
# (BN-REQ-OPS-007, verificados a diario por drift-check.yml) y los escalones de
# la promoción se eligen por entorno en el job `promote`. El canario aparte
# (`netpay-api-canary`) ya no hace falta: la revisión etiquetada tiene su propia
# URL y es exactamente lo que se va a promover.
#
# Diseño y motivos: docs/DEPLOY-GCP.md §12.

name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment de GitHub (staging | production)'
        required: true
        type: string
      skip_migrations:
        description: 'Omitir las migraciones (solo hotfix; deja el esquema atrás)'
        required: false
        type: boolean
        default: false

# El grupo incluye el entorno para que un despliegue a staging no cancele uno
# de producción ni al revés, y la ref para que dos ramas no se pisen.
#
# Solo se cancela un despliegue a staging lanzado desde un PR: es el caso en el
# que un commit nuevo deja obsoleto el anterior y no hay nada que perder. En
# cualquier otro caso no se cancela: cortar entre migrar y promover deja
# esquema y código descuadrados (§12.3).
concurrency:
  group: deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.environment == 'staging' && github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # build: imágenes por digest, SBOM y provenance
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push-app.outputs.digest }}
      migrate_digest: ${{ steps.push-migrate.outputs.digest }}
    env:
      # Registro del entorno, no del repositorio: el registro se compone con
      # las variables del environment, así que staging empuja a
      # vondi-0q-staging y producción a vondi-0q sin tocar nada aquí.
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ vars.IMAGE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Credenciales de WIF (sin clave JSON). `access_token` explícito porque el
      # registro de Artifact Registry necesita un token de acceso, no un ID token.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build and push runtime image
        id: push-app
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          # Lo que /health/ready autenticado reporta (src/config/build-info.ts).
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=run-${{ github.run_number }}.${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          platforms: linux/amd64

      - name: Build and push migrate image
        id: push-migrate
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE_BASE }}-migrate:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          platforms: linux/amd64

      # Aquí NO hay escaneo de vulnerabilidades, y es deliberado.
      #
      # `trivy-action` se descargaba su binario desde GitHub en cada run, y en el
      # run 39169632356 —el primer despliegue a producción— esa descarga falló y
      # el paso devolvió exit 1. El pipeline paró, que es lo correcto, pero no
      # porque la imagen tuviera un CVE: Trivy no llegó a escanear nada. Un gate
      # que no puede distinguir "encontré una vulnerabilidad" de "no pude
      # descargar el escáner" no es un gate: es un paso que se re-lanza hasta que
      # pasa, y el día que alguien no lo re-lanza el seguro no era seguro.
      #
      # El escaneo vive ahora en dos sitios que no pueden tumbar un despliegue:
      # `ci.yml` escanea el árbol de dependencias en cada PR y sube el informe
      # como artefacto, y Artifact Analysis escanea cada imagen al subirla al
      # registro, dentro del proyecto. La señal se conserva; la dependencia de
      # una descarga de terceros sale del camino crítico.

  # ===========================================================================
  # migrate: Cloud Run Job, una ejecución, sin reintentos
  # ===========================================================================
  migrate:
    name: Migraciones
    needs: build
    if: ${{ !inputs.skip_migrations }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      MIGRATOR_SA: ${{ vars.MIGRATOR_SA }}
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ vars.IMAGE_NAME }}
      # Red de salida: sin esto la IP de egress es efímera y no hay una que
      # registrar en Neon. Creada por scripts/provision-network.sh (docs §7).
      NETWORK: vondi-net
      SUBNET: vondi-subnet
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      # `npm run db:migrate:all`: plano de control y después las migraciones de
      # tenant en todo tenant ACTIVE, con lock advisory por esquema, ledger de
      # checksums y verificación final (scripts/migrate-tenants.ts,
      # BN-REQ-OPS-002). Si un esquema queda atrás o un checksum no coincide, el
      # Job falla y no se despliega nada.
      #
      # Las migraciones no corren en el arranque: Cloud Run arranca N instancias
      # a la vez y `prisma migrate deploy` no es idempotente bajo concurrencia.
      # El Job corre además con la conexión **directa**, no por el pooler.
      #
      # `--max-retries=0 --tasks=1 --parallelism=1`: una migración se ejecuta
      # una vez; si falla es un fallo visible con intervención humana.
      #
      # `--vpc-egress=all-traffic`: el Job también debe salir por la IP del NAT,
      # o Neon lo rechaza.
      #
      # En staging esto corre contra la rama `staging` de Neon, nunca contra
      # producción, así que puede correr en cada push y en cada PR: es el primer
      # sitio donde se ve que una migración es válida.
      #
      # Si el release trae migraciones destructivas, crear antes una rama de
      # respaldo en Neon (RB-09 / §16.2): el rollback de código no revierte
      # migraciones y la salida es restaurar la base.
      - name: Actualizar y ejecutar el Job
        env:
          IMAGE: ${{ env.IMAGE_BASE }}-migrate@${{ needs.build.outputs.migrate_digest }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="$MIGRATOR_SA" \
            --network="$NETWORK" --subnet="$SUBNET" --vpc-egress=all-traffic \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=900s \
            --command=npm --args=run,db:migrate:all \
            --quiet
          # `--wait` devuelve error si la ejecución falla: detiene el pipeline
          # antes de desplegar código contra un esquema a medias.
          gcloud run jobs execute "$MIGRATE_JOB" --region="$REGION" --wait

  # ===========================================================================
  # deploy: la revisión nueva, sin tráfico y con tag rc-<sha>
  # ===========================================================================
  deploy:
    name: Desplegar
    needs: [build, migrate]
    # `always()` con la condición explícita: es lo que permite que
    # `skip_migrations` salte el Job y el despliegue siga.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      # URL de la revisión etiquetada: lo único que el humo prueba.
      tag_url: ${{ steps.deploy.outputs.tag_url }}
      # URL del servicio: audiencia del ID token del humo.
      url: ${{ steps.deploy.outputs.url }}
      previous: ${{ steps.previous.outputs.revision }}
      revision: ${{ steps.deploy.outputs.revision }}
      tag: ${{ steps.deploy.outputs.tag }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      RUNTIME_SA: ${{ vars.RUNTIME_SA }}
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ vars.IMAGE_NAME }}
      NETWORK: vondi-net
      SUBNET: vondi-subnet
      # Nombre de revisión determinista: permite promover y revertir por nombre
      # en vez de depender de "la última revisión" (§12.3).
      REVISION: r${{ github.sha }}-${{ github.run_attempt }}
    steps:
      # Para scripts/gcp/cloudrun-flags.sh y .github/cloudrun/flags.json.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      # La revisión que sirve tráfico se registra ANTES de desplegar. Con tags,
      # `status.traffic` lista también revisiones etiquetadas al 0%, así que se
      # toma la de mayor porcentaje y no la primera de la lista.
      - name: Registrar la revisión que sirve tráfico hoy
        id: previous
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json \
                | jq -r '([.status.traffic[]? | select((.percent // 0) > 0)] | max_by(.percent) // {}) as $t
                         | $t.revisionName // .status.latestReadyRevisionName // ""')
          if [ -z "$REV" ]; then
            echo "No se pudo determinar la revisión en servicio; el rollback no" >&2
            echo "tendría destino. Se aborta antes de desplegar." >&2
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      # `--no-traffic --tag`: la revisión existe y tiene URL propia, pero no
      # recibe ni una petición de usuarios hasta `promote` (BN-REQ-OPS-006).
      #
      # BUILD_SHA/BUILD_VERSION también como variables del servicio: ya vienen
      # en la imagen, pero así `services describe` dice qué commit corre sin
      # inspeccionar la imagen.
      #
      # Los flags de runtime (min/max instancias, CPU, ingress, egress,
      # concurrencia, timeout) se declaran en .github/cloudrun/flags.json y se
      # aplican en cada despliegue, así que una edición manual en la consola dura
      # hasta el siguiente release y drift-check.yml la detecta antes
      # (BN-REQ-OPS-007). Variables, secretos y probes siguen viviendo en el
      # servicio (scripts/provision-cloudrun.sh).
      - name: Desplegar la revisión sin tráfico
        id: deploy
        env:
          IMAGE: ${{ env.IMAGE_BASE }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="rc-${GITHUB_SHA::8}"
          mapfile -t FLAGS < <(bash scripts/gcp/cloudrun-flags.sh args "$ENVIRONMENT")
          printf 'Flags declarados para %s:\n' "$ENVIRONMENT"; printf '  %s\n' "${FLAGS[@]}"
          gcloud run deploy "$SERVICE" --region="$REGION" --image="$IMAGE" \
            --network="$NETWORK" --subnet="$SUBNET" \
            --service-account="$RUNTIME_SA" \
            --revision-suffix="$REVISION" \
            --no-traffic --tag="$TAG" \
            --update-env-vars="BUILD_SHA=${GITHUB_SHA},BUILD_VERSION=run-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            "${FLAGS[@]}" --quiet
          DESCRIBE=$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json)
          TAG_URL=$(jq -r --arg t "$TAG" '.status.traffic[]? | select(.tag == $t) | .url' <<<"$DESCRIBE")
          if [ -z "$TAG_URL" ]; then
            echo "La revisión no quedó etiquetada como $TAG." >&2
            exit 1
          fi
          {
            echo "revision=${SERVICE}-${REVISION}"
            echo "tag=$TAG"
            echo "tag_url=$TAG_URL"
            echo "url=$(jq -r '.status.url' <<<"$DESCRIBE")"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # smoke: contra la URL etiquetada de la revisión nueva, que aún no tiene tráfico
  # ===========================================================================
  smoke:
    name: Humo
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      # `gcloud auth print-identity-token` rechaza credenciales WIF
      # (external_account): el token lo emite la propia action de auth. La
      # audiencia es la URL del servicio; Cloud Run la acepta también en las
      # URLs de sus tags.
      - name: Token de identidad para el servicio
        id: id_token
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ needs.deploy.outputs.url }}

      # La revisión nueva arranca en frío: /health/live hasta 90 s.
      - name: Liveness y readiness
        env:
          URL: ${{ needs.deploy.outputs.tag_url }}
          TOKEN: ${{ steps.id_token.outputs.id_token }}
        run: |
          set -euo pipefail
          CODE=000
          for _ in $(seq 1 45); do
            CODE=$(curl -s -o /tmp/live.json -w '%{http_code}' \
                   -H "Authorization: Bearer $TOKEN" "$URL/health/live" || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          [ "$CODE" = "200" ] || { echo "FAIL live: $CODE"; exit 1; }

          READY=$(curl -s -o /tmp/ready.json -w '%{http_code}' \
                    -H "Authorization: Bearer $TOKEN" "$URL/health/ready")
          [ "$READY" = "200" ] || { echo "FAIL ready: $READY"; cat /tmp/ready.json; exit 1; }

      # En un servicio privado hay dos capas y Cloud Run da precedencia a
      # X-Serverless-Authorization: el ID token va ahí (pasa IAM) y el guard de
      # la aplicación, que solo lee `authorization`, no ve ningún JWT y
      # responde 401. Probar 401/403 prueba que el auth está montado y que la
      # ruta alcanza la aplicación.
      - name: Una ruta protegida responde 401/403
        env:
          URL: ${{ needs.deploy.outputs.tag_url }}
          TOKEN: ${{ steps.id_token.outputs.id_token }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "X-Serverless-Authorization: Bearer $TOKEN" \
                 "$URL/api/v1/api-keys")
          case "$CODE" in
            401|403) echo "OK ($CODE)" ;;
            *) echo "FAIL: $CODE"; exit 1 ;;
          esac

      # Sin rollback aquí: la revisión nunca recibió tráfico. Un humo rojo deja
      # el job en rojo, `promote` no corre y los usuarios siguen en la anterior.

  # ===========================================================================
  # promote: tráfico por escalones, 5xx en cada uno, rollback automático
  # ===========================================================================
  promote:
    name: Promoción de tráfico
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REVISION: ${{ needs.deploy.outputs.revision }}
      PREVIOUS: ${{ needs.deploy.outputs.previous }}
      TAG: ${{ needs.deploy.outputs.tag }}
      # Producción por escalones; staging, con poco tráfico real, de una vez,
      # pero con la misma verificación de 5xx y el mismo rollback.
      STEPS: ${{ inputs.environment == 'production' && '10 50 100' || '100' }}
      # Observación por escalón antes de leer la métrica.
      OBSERVE_SECONDS: ${{ inputs.environment == 'production' && '300' || '90' }}
      # Toda la vida de la revisión, más el retraso de ingesta de Cloud
      # Monitoring (~3 min): la revisión es nueva, así que es su historial completo.
      WINDOW_SECONDS: '1800'
      MAX_5XX_RATIO: '0.02'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # La identidad necesita roles/monitoring.viewer para leer la tasa de 5xx.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      # El filtro `--format='value(status.conditions[?@.type=="Ready"]...)'`
      # devuelve cadena vacía en esta versión de gcloud y revirtió una revisión
      # sana (run 39182072940). Se lee el JSON y se busca la condición a mano.
      - name: La revisión está Ready
        run: |
          set -euo pipefail
          READY=$(gcloud run revisions describe "$REVISION" --region="$REGION" --format=json \
                  | jq -r '([.status.conditions[]? | select(.type=="Ready") | .status] | first) // ""')
          echo "Estado de $REVISION: Ready=${READY:-<sin condición>}"
          [ "$READY" = "True" ]

      - name: Promover por escalones vigilando 5xx
        run: |
          set -euo pipefail
          for PERCENT in $STEPS; do
            if [ "$PERCENT" -ge 100 ]; then
              SPLIT="$REVISION=100"
            else
              SPLIT="$REVISION=$PERCENT,$PREVIOUS=$((100 - PERCENT))"
            fi
            echo "::group::$PERCENT% a $REVISION"
            gcloud run services update-traffic "$SERVICE" --region="$REGION" \
              --to-revisions="$SPLIT" --quiet
            sleep "$OBSERVE_SECONDS"
            bash scripts/ci/revision-error-rate.sh
            echo "::endgroup::"
          done
          echo "Promovida $REVISION"

      # Un rollback de código no revierte migraciones: por eso las migraciones
      # siguen expand/contract (§12.4, docs/MIGRATIONS.md).
      - name: Rollback a la revisión anterior
        if: failure()
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "No hay revisión anterior registrada; nada que revertir." >&2
            exit 1
          fi
          gcloud run services update-traffic "$SERVICE" --region="$REGION" \
            --to-revisions="$PREVIOUS=100" --quiet
          echo "::error::$SERVICE revertido a $PREVIOUS"

      # Los tags rc- de releases anteriores ya no sirven para nada y cada uno
      # mantiene una URL viva. Se conserva solo el de esta revisión.
      - name: Retirar tags rc- anteriores
        if: success()
        run: |
          set -euo pipefail
          OLD=$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json \
                | jq -r --arg t "$TAG" '[.status.traffic[]? | select(.tag != null and (.tag | startswith("rc-")) and .tag != $t) | .tag] | join(",")')
          if [ -n "$OLD" ]; then
            gcloud run services update-traffic "$SERVICE" --region="$REGION" --remove-tags="$OLD" --quiet
          fi
