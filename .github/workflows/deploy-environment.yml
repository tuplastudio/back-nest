# Despliegue a UN entorno, reutilizable. Lo invoca deploy.yml con
# `environment: staging` o `environment: production`.
#
#   build ─► migrate ─► deploy ─► smoke ─► promote
#                            │        │
#                  falla: nada llega └ falla: rollback
#
# POR QUÉ REUTILIZABLE Y NO DOS FICHEROS
#
# Un fichero por entorno duplicaría el bloque de build, el de migraciones y el
# de humo, que son idénticos salvo por el nombre de sus variables. La
# duplicación no se paga solo en mantenimiento: la primera vez que un cambio
# tuvo que aplicarse a los dos sitios, el error (`gcloud run services deploy`,
# que no existe) estaba en los dos. Una sola definición es la que evita esa
# clase de fallo.
#
# POR QUÉ EL `environment:` VIENE POR INPUT
#
# Es lo que hace que las `vars.*` resuelvan. `GCP_PROJECT_ID` es `vondi-0q` en
# producción y `vondi-0q-staging` en staging, y sale del environment del job
# (§17). Además es lo que concede la identidad por WIF: la condición de la pool
# de producción exige `ref == refs/heads/main` y la de staging
# `environment == staging`, y el job que declara `environment: staging` es
# precisamente el que cumple la segunda.
#
# Por eso las variables van en el `env:` **de cada job** y no a nivel de
# workflow: a nivel de workflow, un job sin `environment:` las recibe vacías y
# sin error, que es como `IMAGE_BASE` llegó a valer `-docker.pkg.dev///vondi-api`
# en el job de verificación. A nivel de job, la variable y el environment que
# la resuelve están en la misma pantalla.
#
# LO QUE ES SOLO DE UN ENTENTIMENT
#
# Tres cosas, y cada una por su motivo:
#
#   * el canario, solo en producción: su URL no es alcanzable desde CI porque
#     producción tiene el ingress cerrado, así que hace falta una revisión
#     desplegada aparte contra la que humear antes de que nada llegue a tráfico;
#   * la promoción, solo en producción: en staging el despliegue ya va al 100%,
#     y `promote` es el mecanismo de "no sirvas tráfico hasta que el humo pase";
#   * el escaneo de la imagen, solo en producción: `trivy-action` necesita
#     permisos de Cloud Storage para su caché, que el deployer de staging no
#     tiene. Las dos imágenes salen del mismo commit, así que escanear en el
#     gate de producción cubre el mismo contenido. Si se quiere el escaneo
#     antes del merge, hay que darle a `vondi-deployer` de staging los
#     mismos permisos que al de producción.
#
# Diseño y motivos: docs/DEPLOY-GCP.md §12.

name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment de GitHub (staging | production)'
        required: true
        type: string
      skip_migrations:
        description: 'Omitir las migraciones (solo hotfix; deja el esquema atrás)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  # build: imágenes por digest, SBOM y provenance
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push-app.outputs.digest }}
      migrate_digest: ${{ steps.push-migrate.outputs.digest }}
    env:
      # Registro del entorno, no del repositorio: el registro se compone con
      # las variables del environment, así que staging empuja a
      # vondi-0q-staging y producción a vondi-0q sin tocar nada aquí.
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/vondi-api
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Credenciales de WIF (sin clave JSON). `access_token` explícito porque el
      # registro de Artifact Registry necesita un token de acceso, no un ID token.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build and push runtime image
        id: push-app
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          platforms: linux/amd64

      - name: Build and push migrate image
        id: push-migrate
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE_BASE }}-migrate:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          platforms: linux/amd64

      # El gate de vulnerabilidades es de producción: además de que en staging
      # costaría el doble para el mismo contenido, `trivy-action` escribe su
      # caché en Cloud Storage y el deployer de staging no tiene ese permiso.
      - name: Escanear la imagen por digest
        if: inputs.environment == 'production'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE_BASE }}@${{ steps.push-app.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Findings aceptados a propósito, cada uno con su motivo. El gate
          # sigue bloqueando ante cualquier otro HIGH/CRITICAL.
          trivyignores: .trivyignore
        env:
          TRIVY_USERNAME: oauth2accesstoken
          TRIVY_PASSWORD: ${{ steps.auth.outputs.access_token }}

  # ===========================================================================
  # migrate: Cloud Run Job, una ejecución, sin reintentos
  # ===========================================================================
  migrate:
    name: Migraciones
    needs: build
    if: ${{ !inputs.skip_migrations }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/vondi-api
      # Red de salida: sin esto la IP de egress es efímera y no hay una que
      # registrar en Neon. Creada por scripts/provision-network.sh (docs §7).
      NETWORK: vondi-net
      SUBNET: vondi-subnet
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      # Las migraciones no corren en el arranque: Cloud Run arranca N instancias
      # a la vez y `prisma migrate deploy` no es idempotente bajo concurrencia.
      # El Job corre además con la conexión **directa**, no por el pooler.
      #
      # `--max-retries=0 --tasks=1 --parallelism=1`: una migración se ejecuta
      # una vez; si falla es un fallo visible con intervención humana.
      #
      # `--vpc-egress=all-traffic`: el Job también debe salir por la IP del NAT,
      # o Neon lo rechaza.
      #
      # En staging esto corre contra la rama `staging` de Neon, nunca contra
      # producción, así que puede correr en cada push y en cada PR: es el primer
      # sitio donde se ve que una migración es válida.
      #
      # Si el release trae migraciones destructivas, crear antes una rama de
      # respaldo en Neon (RB-09 / §16.2): el rollback de código no revierte
      # migraciones y la salida es restaurar la base.
      - name: Actualizar y ejecutar el Job
        env:
          IMAGE: ${{ env.IMAGE_BASE }}-migrate@${{ needs.build.outputs.migrate_digest }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="vondi-migrator@$PROJECT_ID.iam.gserviceaccount.com" \
            --network="$NETWORK" --subnet="$SUBNET" --vpc-egress=all-traffic \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=900s \
            --quiet
          # `--wait` devuelve error si la ejecución falla: detiene el pipeline
          # antes de desplegar código contra un esquema a medias.
          gcloud run jobs execute "$MIGRATE_JOB" --region="$REGION" --wait

  # ===========================================================================
  # deploy: la revisión nueva, sin tráfico en producción
  # ===========================================================================
  deploy:
    name: Desplegar
    needs: [build, migrate]
    # `always()` con la condición explícita: es lo que permite que
    # `skip_migrations` salte el Job y el despliegue siga. `staging_smoke` ya no
    # aparece aquí — que producción espere a staging es una dependencia de jobs
    # en deploy.yml, no una condición dentro de este workflow.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      # La URL que el humo debe probar. En producción es la del canario, porque
      # la URL de producción no es alcanzable desde CI; en staging es el propio
      # servicio. El humo no necesita saber por qué: solo necesita una URL y un
      # token.
      url: ${{ steps.target.outputs.url }}
      previous: ${{ steps.previous.outputs.revision }}
      # Los dos pasos de despliegue (con y sin tráfico) no pueden compartir `id`
      # dentro del mismo job, así que la revisión sale del que corresponde a este
      # entorno. `||` es el fallback: el otro paso no se ejecutó y su salida no
      # existe.
      revision: ${{ steps.deploy_no_traffic.outputs.revision || steps.deploy_traffic.outputs.revision }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      # Vacío en staging: ese environment no define `CLOUD_RUN_CANARY`, y aquí
      # no se usa. Es `if` de shell, no una variable interpolada en el comando.
      CANARY: ${{ vars.CLOUD_RUN_CANARY }}
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/vondi-api
      NETWORK: vondi-net
      SUBNET: vondi-subnet
      # Nombre de revisión determinista: permite promover y revertir por nombre
      # en vez de depender de "la última revisión" (§12.3).
      REVISION: r${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      # La revisión que sirve tráfico se registra ANTES de desplegar: leerla
      # después devuelve la nueva, y el rollback se quedaría sin a qué volver.
      - name: Registrar la revisión que sirve tráfico hoy
        id: previous
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "$SERVICE" --region="$REGION" \
                --format='value(status.traffic[0].revisionName)')
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Resolver la URL que humear
        id: target
        run: |
          set -euo pipefail
          # En producción la URL del servicio no es alcanzable desde CI
          # (ingress cerrado, §13.2), así que se humea el canario. En staging
          # el servicio es el objetivo. En ambos casos lo desplegado es
          # `$SERVICE`.
          TARGET="$SERVICE"
          if [ "$ENVIRONMENT" = production ]; then
            TARGET="$CANARY"
          fi
          URL=$(gcloud run services describe "$TARGET" --region="$REGION" \
                --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # El canario existe porque producción tiene el ingress cerrado: sin una
      # revisión desplegada aparte contra la que humear, el humo no podría
      # comprobar nada antes de que la revisión nueva reciba tráfico. Es
      # privado (requiere token de identidad) y con webhooks desactivados para
      # no despachar nada desde una versión sin validar.
      - name: Desplegar el canario
        if: inputs.environment == 'production'
        env:
          IMAGE: ${{ env.IMAGE_BASE }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          gcloud run deploy "$CANARY" --region="$REGION" --image="$IMAGE" \
            --network="$NETWORK" --subnet="$SUBNET" --vpc-egress=all-traffic \
            --service-account="vondi-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --ingress=all --no-allow-unauthenticated \
            --min-instances=0 --max-instances=1 \
            --revision-suffix="$REVISION" \
            --update-env-vars="OUTBOUND_WEBHOOK_ENABLED=false" --quiet

      # Solo cambian imagen y nombre de revisión: el resto de la configuración
      # (probes, secretos, variables) vive en el servicio (§11.2). Un flag
      # ausente aquí no se resetea, porque `gcloud run deploy` parte de la
      # configuración actual y aplica encima lo indicado; verificado en el
      # canario, cuyo egress por NAT sobrevive a un deploy solo-imagen.
      #
      # El egress se repite de todas formas en vez de confiar en eso: es lo que
      # hace que la IP de salida sea la del NAT y no una efímera de Google, y si
      # alguien recrea el servicio sin la VPC, aquí se ve en el log en vez de
      # descubrirlo cuando Neon deje de aceptar la conexión.
      - name: Desplegar la revisión sin tráfico (producción)
        if: inputs.environment == 'production'
        id: deploy_no_traffic
        env:
          IMAGE: ${{ env.IMAGE_BASE }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" --region="$REGION" --image="$IMAGE" \
            --network="$NETWORK" --subnet="$SUBNET" --vpc-egress=all-traffic \
            --service-account="vondi-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --revision-suffix="$REVISION" --no-traffic --quiet
          echo "revision=${SERVICE}-${REVISION}" >> "$GITHUB_OUTPUT"

      # En staging el despliegue va al 100% y el lazo inverso es el rollback del
      # humo: si falla, el servicio vuelve a la revisión que sí respondía. No hay
      # canario porque su URL es alcanzable, así que el humo puede comprobar la
      # revisión nueva donde está sirviendo de verdad.
      #
      # Sin `--update-env-vars`: las variables, los secretos y los probes viven
      # en el servicio (scripts/provision-cloudrun.sh). Duplicarlos aquí sería
      # una segunda fuente de verdad que deriva.
      - name: Desplegar la revisión con tráfico (staging)
        if: inputs.environment == 'staging'
        id: deploy_traffic
        env:
          IMAGE: ${{ env.IMAGE_BASE }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" --region="$REGION" --image="$IMAGE" \
            --network="$NETWORK" --subnet="$SUBNET" --vpc-egress=all-traffic \
            --service-account="vondi-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --revision-suffix="$REVISION" --quiet
          echo "revision=${SERVICE}-${REVISION}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # smoke: contra el canario en producción, contra el servicio en staging
  # ===========================================================================
  smoke:
    name: Humo
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      # `gcloud auth print-identity-token` rechaza credenciales WIF
      # (external_account): el token lo emite la propia action de auth.
      #
      # Ambos entornos exigen IAM (scripts/provision-cloudrun.sh), así que el
      # humo necesita identidad en los dos.
      - name: Token de identidad para el servicio
        id: id_token
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ needs.deploy.outputs.url }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      # La revisión nueva arranca en frío: /health/live hasta 90 s.
      - name: Liveness y readiness
        env:
          URL: ${{ needs.deploy.outputs.url }}
          TOKEN: ${{ steps.id_token.outputs.id_token }}
        run: |
          set -euo pipefail
          CODE=000
          for _ in $(seq 1 45); do
            CODE=$(curl -s -o /tmp/live.json -w '%{http_code}' \
                   -H "Authorization: Bearer $TOKEN" "$URL/health/live" || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          [ "$CODE" = "200" ] || { echo "FAIL live: $CODE"; exit 1; }

          READY=$(curl -s -o /tmp/ready.json -w '%{http_code}' \
                    -H "Authorization: Bearer $TOKEN" "$URL/health/ready")
          [ "$READY" = "200" ] || { echo "FAIL ready: $READY"; cat /tmp/ready.json; exit 1; }

      # En un servicio privado hay dos capas y Cloud Run da precedencia a
      # X-Serverless-Authorization: el ID token va ahí (pasa IAM) y el guard de
      # la aplicación, que solo lee `authorization`, no ve ningún JWT y
      # responde 401. Probar 401/403 prueba que el auth está montado y que la
      # ruta alcanza la aplicación.
      - name: Una ruta protegida responde 401/403
        env:
          URL: ${{ needs.deploy.outputs.url }}
          TOKEN: ${{ steps.id_token.outputs.id_token }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "X-Serverless-Authorization: Bearer $TOKEN" \
                 "$URL/api/v1/api-keys")
          case "$CODE" in
            401|403) echo "OK ($CODE)" ;;
            *) echo "FAIL: $CODE"; exit 1 ;;
          esac

      # El rollback va antes de propagar el fallo: el job tiene que quedar en
      # rojo para que el pipeline no siga, y el servicio tiene que volver a la
      # revisión que sí respondía. Un despliegue fallido que deja el entorno
      # roto es peor que un pipeline rojo.
      #
      # Solo cuando el despliegue fue con tráfico (staging). En producción la
      # revisión nueva nunca recibió tráfico y `promote` es quien decide; revertir
      # aquí no tocaría nada y escondería el fallo real.
      - name: Volver a la revisión anterior
        if: failure() && inputs.environment == 'staging'
        env:
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "No hay revisión anterior registrada; nada que revertir."
            exit 1
          fi
          gcloud run services update-traffic "$SERVICE" --region="$REGION" \
            --to-revisions="$PREVIOUS=100" --quiet
          echo "$SERVICE revertido a $PREVIOUS"

  # ===========================================================================
  # promote: 100% a la revisión nueva; rollback si no queda sana (producción)
  # ===========================================================================
  promote:
    name: Promoción de tráfico
    # Solo producción: en staging el despliegue ya va al 100% y este job no
    # tendría nada que promover.
    if: ${{ inputs.environment == 'production' }}
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      - name: Promover
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --region="$REGION" \
            --to-revisions="${{ needs.deploy.outputs.revision }}=100" --quiet

      # Un rollback de código no revierte migraciones: por eso las migraciones
      # son compatibles hacia atrás (§12.4).
      - name: Verificar la promoción (rollback si falla)
        env:
          REVISION: ${{ needs.deploy.outputs.revision }}
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
        run: |
          set -euo pipefail
          READY=$(gcloud run revisions describe "$REVISION" --region="$REGION" \
                  --format='value(status.conditions[?@.type=="Ready"].status)')
          if [ "$READY" != "True" ]; then
            echo "Revisión $REVISION no sana (Ready=$READY); revirtiendo a $PREVIOUS"
            gcloud run services update-traffic "$SERVICE" --region="$REGION" \
              --to-revisions="$PREVIOUS=100" --quiet
            exit 1
          fi
          echo "Promovida $REVISION"
