name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Dry run (show changes without applying)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Set environment variables
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
            echo "DATABASE_URL_UNPOOLED=${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" >> $GITHUB_ENV
            echo "DATABASE_URL_UNPOOLED=${{ secrets.STAGING_DATABASE_URL_UNPOOLED }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          fi

      - name: Check database connection
        run: |
          npm install -g pg
          node -e "
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL_UNPOOLED });
          client.connect();
          client.query('SELECT 1').then(() => {
            console.log('Database connection successful');
            client.end();
          }).catch(err => {
            console.error('Database connection failed:', err);
            process.exit(1);
          });
          "

      - name: Show pending migrations
        run: |
          echo "Checking pending migrations for ${{ github.event.inputs.environment }}..."
          npx prisma migrate status --schema prisma/schema.prisma

      - name: Apply control plane migrations (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would apply the following migrations:"
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script

      - name: Apply control plane migrations
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Applying control plane migrations to ${{ github.event.inputs.environment }}..."
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Verifying migration..."
          npx prisma migrate status --schema prisma/schema.prisma

      - name: Create migration summary
        if: always()
        run: |
          echo "### Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Migration completed at $(date -u)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Rollback Job: Rollback last migration
  # =============================================================================
  rollback:
    name: Rollback Last Migration
    runs-on: ubuntu-latest
    if: github.event.inputs.rollback == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Set environment variables
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
            echo "DATABASE_URL_UNPOOLED=${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" >> $GITHUB_ENV
            echo "DATABASE_URL_UNPOOLED=${{ secrets.STAGING_DATABASE_URL_UNPOOLED }}" >> $GITHUB_ENV
          fi

      - name: Resolve migration
        run: |
          echo "Resolving last migration..."
          npx prisma migrate resolve --applied "MIGRATION_NAME" --schema prisma/schema.prisma

      - name: Rollback migration
        run: |
          echo "Rolling back last migration..."
          # Note: Prisma doesn't have automatic rollback
          # You need to manually create a rollback migration
          # or use prisma migrate resolve to mark as applied/rolled back
