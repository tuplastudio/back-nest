# Verificación: formato, lint, tipos, secretos, tests unitarios con cobertura
# (umbral en src/payments), migraciones (plano de control y tenants), e2e contra
# un Postgres desechable y Trivy bloqueante sobre el árbol y la imagen.
#
# Es un workflow REUTILIZABLE (`workflow_call`, BN-REQ-OPS-001): lo invoca
# deploy.yml como job `ci`, y los despliegues lo esperan con `needs`. Antes
# eran dos workflows hermanos disparados por el mismo push, y nada impedía que
# el despliegue saliera con los tests en rojo: corrían en paralelo. Ahora un
# push con tests fallando no despliega, porque el job que despliega no empieza.
# Los checks que exige la protección de `main` llevan por eso el prefijo del
# job llamador: «CI / Verificación, tests y e2e» y «CI / Vulnerabilidades»
# (scripts/github/protect-repo.sh).
#
# Este workflow no despliega nada y no depende de ningún environment de GitHub.
# Vive en su propio fichero porque no arrastra las variables de GCP. En el workflow de despliegue las
#     `vars.*` del nivel de workflow se resuelven según el `environment:` de
#     cada job, y un job sin environment las recibe **vacías y sin avisar**
#     (IMAGE_BASE quedaba como `-docker.pkg.dev///`). Aquí no hay
#     ninguna: un job nuevo no puede heredar ese fallo silencioso.
#
# La cancelación sí se permite, y solo en PR: un commit nuevo invalida el
# anterior. En el despliegue no, por §12.3.
#
# Diseño y motivos: docs/DEPLOY-GCP.md §12.

name: ci

on:
  # Lo dispara deploy.yml en cada push y PR a main/staging.
  workflow_call:
  # Para relanzar la verificación sola, sin desplegar.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'

jobs:
  verify:
    name: Verificación, tests y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mtb_test
          # Misma configuración que en docker-compose.yml: la colación
          # determinista evita que el orden de índices derive entre máquinas.
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mtb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # El escaneo de historia (secrets:history) necesita el historial.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # `secrets:staged` escanea el índice, que en un checkout de CI está
      # vacío: escanea el set commiteable (`secrets`) y el histórico completo
      # (`secrets:history`).
      - name: Secrets (set commiteable)
        run: npm run secrets

      - name: Secrets (histórico)
        run: npm run secrets:history

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Con MIGRATIONS_BASE_REF el validador además rechaza editar, renombrar o
      # borrar una migración ya mergeada: el ledger de tenants lo detectaría en
      # el Job de despliegue (checksum distinto) y abortaría el release; aquí
      # falla en el PR. En un push se compara con el commit anterior.
      - name: Validar migraciones (plano de control y tenants)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            export MIGRATIONS_BASE_REF="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            export MIGRATIONS_BASE_REF="$BEFORE"
          fi
          npm run migrations:validate

      # Promoción por escalones y drift de flags: scripts que solo corren contra
      # GCP, probados aquí con fixtures.
      - name: Scripts del pipeline (fixtures)
        run: bash scripts/ci/test-pipeline-scripts.sh

      # Falla si la cobertura de líneas de src/payments baja del umbral de
      # jest.config.mjs (BN-REQ-OPS-009).
      - name: Tests unitarios con cobertura
        run: npm run test:cov

      # La cobertura la escribe el paso anterior en coverage/lcov.info.
      # `fail_ci_if_error: false` a propósito: la cobertura informa, no bloquea un
      # release cuyos tests ya pasaron, y en un PR desde un fork el secret no
      # existe, así que un upload fallido no puede romper el pipeline.
      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          # Solo el lcov de Jest: sin búsqueda, el CLI no sube ni el HTML de
          # coverage/lcov-report ni restos de otros formatos.
          disable_search: true
          fail_ci_if_error: false
          verbose: true

      # `services: postgres` no ejecuta docker/postgres/init, así que los roles
      # de menor privilegio se crean aquí (§12.2). El plano de control migra
      # como superusuario de este Postgres desechable y el plano de datos
      # conecta como mtb_app, para que las políticas RLS sean exigibles
      # (un dueño de tabla las ignora; ver docker/postgres/init/01-roles.sql).
      - name: Crear roles de la base (mtb_control, mtb_app)
        env:
          PGPASSWORD: postgres
          MTB_CONTROL_PASSWORD: ${{ github.run_id }}-control
          MTB_APP_PASSWORD: ${{ github.run_id }}-app
        run: |
          command -v psql >/dev/null || sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d mtb_test -v ON_ERROR_STOP=1 \
            -f docker/postgres/init/01-roles.sql
          echo "::add-mask::$MTB_APP_PASSWORD"

      # Contra Postgres real: el runner de migraciones de tenant (3 esquemas,
      # ejecución concurrente, checksum alterado y adopción de esquemas previos
      # al ledger, BN-REQ-OPS-002), el outbox transaccional de eventos (rollback,
      # caída antes de despachar, secuencia por orden; BN-REQ-EVT-004/005/006) y
      # las rutas de recuperación de pagos (resultados pendientes con fallo de BD
      # inyectado, CHARGE_UNKNOWN, intentos e idempotencia; BN-TASK-010/011/014/015).
      # Cada suite crea y borra su propia base.
      - name: Integración (migraciones de tenant y outbox)
        env:
          TENANT_MIGRATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:int

      # El plano de control se migra con la variante sin pooler porque
      # prisma.config.ts lee CONTROL_PLANE_DATABASE_URL_UNPOOLED y no acepta
      # fallback: migrar por PgBouncer es justamente el fallo que ese
      # desdoblamiento previene.
      #
      # Claves efímeras por ejecución: env.validation.ts rechaza los
      # placeholders de .env.example, y la suite necesita que el seed, el
      # servidor que arranca en beforeAll y el proceso de test compartan las
      # mismas, porque las filas PII que el seed cifra las descifra el servidor.
      - name: Credenciales efímeras para e2e
        run: |
          {
            echo "PII_HMAC_KEY=$(openssl rand -base64 24)"
            echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "NETPAY_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 32)"
            echo "DOCS_BASIC_AUTH_PASSWORD=$(openssl rand -base64 16)"
            echo "SEED_OWNER_PASSWORD=$(openssl rand -base64 16)"
            echo "SEED_MEMBER_PASSWORD=$(openssl rand -base64 16)"
            echo "SEED_OWNER_EMAIL=ci-owner@example.test"
            echo "SEED_MEMBER_EMAIL=ci-member@acme.test"
            echo "SEED_TENANT_SLUG=acme"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$(openssl rand -hex 8)"

      # El catálogo RBAC (`roles`) lo siembra prisma/seed.ts, no la suite: sin
      # él, `seedAdmin` no encuentra el rol platform-owner y toda ruta protegida
      # responde 403. Y el seed necesita el esquema, así que las migraciones se
      # aplican antes, con el mismo entrypoint que usa el Job de producción
      # (scripts/migrate.ts), no con un `prisma migrate deploy` suelto.
      - name: Aplicar migraciones del plano de control
        env:
          NODE_ENV: test
          CONTROL_PLANE_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/mtb_test?schema=public
        run: npm run db:migrate:deploy

      - name: Sembrar catálogo RBAC e identidades
        env:
          NODE_ENV: test
          CONTROL_PLANE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mtb_test?schema=public
          CONTROL_PLANE_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/mtb_test?schema=public
        run: npm run prisma:seed

      # docs/openapi.json es el contrato publicado (BN-REQ-API-001), con los
      # eventos salientes en `x-webhooks` y el sobre de error. Se regenera desde
      # el código (arranca la app: la DI de Nest necesita la base migrada) y el
      # job falla si difiere del commiteado: `npm run docs:openapi` y commit.
      - name: OpenAPI sincronizado con el código
        env:
          NODE_ENV: test
          CONTROL_PLANE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mtb_test?schema=public
          CONTROL_PLANE_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/mtb_test?schema=public
          TENANT_PLANE_DATABASE_URL: postgresql://mtb_app:${{ github.run_id }}-app@localhost:5432/mtb_test?schema=public
        run: npm run openapi:check

      - name: E2E
        env:
          NODE_ENV: test
          CONTROL_PLANE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mtb_test?schema=public
          CONTROL_PLANE_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/mtb_test?schema=public
          TENANT_PLANE_DATABASE_URL: postgresql://mtb_app:${{ github.run_id }}-app@localhost:5432/mtb_test?schema=public
        run: npm run test:e2e

  # ===========================================================================
  # scan: vulnerabilidades HIGH/CRITICAL del árbol y de la imagen, BLOQUEANTE
  # ===========================================================================
  #
  # BN-REQ-OPS-008. El escaneo era informativo porque una descarga fallida del
  # binario de Trivy tumbó un despliegue sin que hubiera ningún CVE (run
  # 39169632356). Eso se resuelve con un reintento, no quitando el gate: el
  # primer intento tolera el fallo y el segundo, que solo corre si el primero
  # falló, no. Un CVE real falla los dos (es determinista); una caída de red,
  # casi nunca dos veces. Los hallazgos aceptados van en .trivyignore, con motivo.
  #
  # La imagen se construye aquí, en local y sin empujar: el paquete del sistema
  # base (node:22-alpine) no aparece en el lockfile y solo se ve escaneando la
  # imagen. Mismo Dockerfile y target que el despliegue.
  scan:
    name: Vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # `version`: el valor por defecto de trivy-action v0.33.1 (v0.65.0) ya no
      # existe como release en GitHub y la instalación falla; se fija una publicada.
      - name: Escanear dependencias
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

      - name: Escanear dependencias (reintento, bloqueante)
        if: steps.trivy_fs.outcome == 'failure'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Construir la imagen de runtime (sin publicar)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: netpay-api:ci-${{ github.sha }}
          cache-from: type=gha,scope=app
          platforms: linux/amd64

      - name: Escanear la imagen
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          scan-type: image
          image-ref: netpay-api:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

      - name: Escanear la imagen (reintento, bloqueante)
        if: steps.trivy_image.outcome == 'failure'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          scan-type: image
          image-ref: netpay-api:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table
