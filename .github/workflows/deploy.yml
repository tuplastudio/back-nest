# Orquestador de despliegue. No despliega nada: decide a qué entorno se llama
# y en qué orden. La lógica de un entorno está en deploy-environment.yml, que es
# reutilizable; la verificación está en ci.yml.
#
#   staging ─► ci ─► deploy-environment (staging)
#                            │
#   main    ─► ci ───────────┴─► deploy-environment (production)
#
# Es decir: `main` pasa por staging antes de llegar a producción. Un release que
# no arrancó contra la base de staging no llega a tocar la de producción, y esa
# espera es una dependencia de jobs — `needs` — no una condición escrita dentro
# del despliegue. Que sea `needs` y no un `if` importa: un job omitido no
# bloquea al que lo espera, así que una puerta tiene que ser explícita.
#
# La lista de entornos sale de los jobs, no de una variable: añadir un entorno es
# un job más aquí, con su environment en GitHub y sus variables, y nada más.
#
# Diseño y motivos: docs/DEPLOY-GCP.md §12 y §17.

name: deploy

on:
  push:
    branches: [main, staging]
    # La documentación no cambia el runtime; no debe gastar un release.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Desplegar a producción sin migraciones (solo hotfix; deja el esquema atrás)'
        type: boolean
        default: false

# Sin `concurrency` aquí a propósito. El grupo de serialización vive en
# deploy-environment.yml e incluye el entorno, de modo que dos pushes seguidos a
# `main` no se pisan: el segundo espera a que el primero libere el grupo. Poner
# también un grupo en el orquestador, con el mismo nombre, haría que la segunda
# llamada cancelara o esperara a la primera —que es la llamada padre—, y el
# pipeline se quedaría esperando a sí mismo.

permissions:
  contents: read

jobs:
  # Los PR despliegan a staging: probarlos contra una base de verdad es el
  # objetivo del entorno. Un PR de un fork no tiene los secrets ni la WIF del
  # environment, así que se omite en vez de fallar.
  deploy_staging:
    name: Desplegar a staging
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
