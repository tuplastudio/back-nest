# Orquestador de despliegue. No despliega nada: decide qué se verifica, a qué
# entorno se llama y en qué orden. La verificación está en ci.yml y la lógica de
# un entorno en deploy-environment.yml; los dos son reutilizables.
#
#   push/PR ─► ci ─► deploy-environment (staging)
#                            │
#   main    ─────────────────┴─► deploy-environment (production)
#
# `ci` es un job de ESTE workflow y los despliegues lo esperan con `needs`
# (BN-REQ-OPS-001). Antes ci.yml era un workflow hermano disparado por el mismo
# push y nada lo esperaba: un push a main con tests en rojo desplegaba igual.
#
# Es decir: `main` pasa por staging antes de llegar a producción. Un release que
# no arrancó contra la base de staging no llega a tocar la de producción, y esa
# espera es una dependencia de jobs — `needs` — no una condición escrita dentro
# del despliegue. Que sea `needs` y no un `if` importa: un job omitido no
# bloquea al que lo espera, así que una puerta tiene que ser explícita.
#
# La lista de entornos sale de los jobs, no de una variable: añadir un entorno es
# un job más aquí, con su environment en GitHub y sus variables, y nada más.
#
# Diseño y motivos: docs/DEPLOY-GCP.md §12 y §17.

name: deploy

on:
  push:
    branches: [main, staging]
    # La documentación no cambia el runtime; no debe gastar un release.
    paths-ignore: ['docs/**', '**/*.md']
  # Sin paths-ignore en PR: los checks de CI son obligatorios para mergear a
  # `main`, y un workflow que no corre deja el check pendiente para siempre.
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Desplegar a producción sin migraciones (solo hotfix; deja el esquema atrás)'
        type: boolean
        default: false

# Sin `concurrency` aquí a propósito. El grupo de serialización vive en
# deploy-environment.yml e incluye el entorno, de modo que dos pushes seguidos a
# `main` no se pisan: el segundo espera a que el primero libere el grupo. Poner
# también un grupo en el orquestador, con el mismo nombre, haría que la segunda
# llamada cancelara o esperara a la primera —que es la llamada padre—, y el
# pipeline se quedaría esperando a sí mismo.

# `id-token: write` es obligatorio aquí y no opcional: un workflow llamado no
# puede pedir más permisos de los que le concede quien lo llama. Sin esta línea,
# el reusable se muere antes de empezar con `startup_failure` en ESTE workflow,
# no con un error en el job que lo pide, porque el que valida es el orquestador.
permissions:
  contents: read
  id-token: write

jobs:
  # Verificación completa. `secrets: inherit` para CODECOV_TOKEN; ci.yml no
  # recibe ninguna variable de GCP.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Los PR despliegan a staging: probarlos contra una base de verdad es el
  # objetivo del entorno. Un PR de un fork no tiene los secrets ni la WIF del
  # environment, así que se omite en vez de fallar.
  deploy_staging:
    name: Desplegar a staging
    needs: ci
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging

  # Solo `main`, y solo después de que staging esté en verde. Antes, un "cualquier
  # push" con la rama `staging` en juego significaba empujar al registro de
  # producción desde un push a staging.
  deploy_production:
    name: Desplegar a producción
    # `ci` explícito aunque staging ya lo espere: la puerta no debe depender de
    # que nadie quite un eslabón intermedio.
    needs: [ci, deploy_staging]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      # `inputs.skip_migrations` es null en un push; sin el `|| false` se
      # pasaría un null a un input booleano en lugar de usar su default.
      skip_migrations: ${{ inputs.skip_migrations || false }}
