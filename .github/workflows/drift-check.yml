# Verificación diaria de drift de los flags de Cloud Run (BN-REQ-OPS-007).
#
# Compara cada servicio con .github/cloudrun/flags.json, la misma fuente que
# aplica el despliegue. Una edición manual en la consola (min-instances,
# throttling de CPU, ingress, egress…) pone este workflow en rojo al día
# siguiente, en vez de descubrirse cuando el próximo release la revierta sin
# avisar o, peor, cuando Neon rechace una IP de salida efímera.
#
# Solo lectura. Corre en environments propios (`staging-readonly`,
# `production-readonly`) porque el environment `production` exige aprobación de
# un revisor y un job programado se quedaría esperándola. Esos environments
# tienen sus variables y una cuenta de servicio con roles/run.viewer como única
# autoridad (docs/DEPLOY-GCP.md §12, scripts/github/protect-repo.sh).

name: drift-check

on:
  schedule:
    # 07:17 UTC, fuera de la hora en punto en que se acumulan los cron de GitHub.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Drift de ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}-readonly
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DRIFT_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@4111bea454dcfe1b4c2db3753685db043571e112 # v2.1.3

      - name: Comparar con flags.json
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --region="$REGION" --format=json > "$RUNNER_TEMP/service.json"
          bash scripts/gcp/cloudrun-flags.sh check "$ENVIRONMENT" "$RUNNER_TEMP/service.json"
